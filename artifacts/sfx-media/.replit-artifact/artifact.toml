kind = "web"
previewPath = "/"
title = "SFX Utah"
version = "1.0.0"
id = "artifacts/sfx-media"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18730
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/sfx-media run dev"

[services.env]
PORT = "18730"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/sfx-media", "run", "build"]
publicDir = "artifacts/sfx-media/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
